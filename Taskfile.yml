version: '3'

vars:
  GOLANGCI_LINT_VERSION: v2.15.0
  STATICCHECK_VERSION: 2026.2.2
  GOVULNCHECK_VERSION: v1.1.4

tasks:
  gate:
    desc: Run all required build, analysis, security, and race coverage checks
    cmds:
      - go build ./...
      - go vet ./...
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run --timeout=5m
      - go run honnef.co/go/tools/cmd/staticcheck@{{.STATICCHECK_VERSION}} ./...
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...
      - go test -race -coverprofile=coverage.out ./...
      - |
        total="$(go tool cover -func=coverage.out | awk '$1 == "total:" { gsub("%", "", $3); print $3 }')"
        awk -v total="$total" 'BEGIN { if (total + 0 < 90) { printf "coverage %.1f%% is below required 90%%\n", total; exit 1 } }'
      - go tool cover -func=coverage.out
